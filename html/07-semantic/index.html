<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07-semantic tag in html</title>
</head>
<body>
    <h1>semantic tag in html</h1>
    <!-- <span style="font-size: 32px; margin: 21px 0;">Not a top-level heading!</span> -->
    <header>
        <h1>these are the semantic tags</h1>
        <nav>
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Contact</a>
        </nav>
    </header>
    <hr>
    <div>
        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Contact</a>
    </div>

    <button>submit</button>

    <button aria-label="close">close</button>
    <button aria-label="search">search</button>
</body>
</html>
