<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar Using | Media Queries</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navbar  -->

    <nav class="navbar">
      <div class="logo">Code <span class="logo-span">Kariba</span></div>

      <input type="checkbox" id="menu-toggle" />

      <!-- Hamburger -->
      <label for="menu-toggle" class="menu-btn">
        <span class="hamburger">☰</span>
        <span class="close">✕</span>
      </label>

      <!-- Navigation Links -->
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>
      </div>
    </nav>

    <!-- Hero section  -->

    <section class="hero">
      <h1>Learn Web Development</h1>
      <p>Build Modern Websites Using MERN Stack + AI</p>

      <button class="hero-btn">Start Learning</button>
    </section>
  </body>
</html>
