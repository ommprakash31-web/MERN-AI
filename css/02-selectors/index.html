<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02-selectors</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        /* color: red; */
    }
    h1{
        color: green;
    }
    p{
        color: orange;
        font-size: 30px;
    }
    .randomClass{
        background: linear-gradient(to right, blue, lightblue);
    }
</style>

<body>
    <h1>Selectors in CSS</h1>
    <div>
        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Ex atque soluta eligendi voluptatibus nesciunt quibusdam enim adipisci esse laborum quidem!</p>
    </div>

    <div class="randomClass">
        <h2>Random Class</h2>
        <p>Lorem ipsum dolor sit amet.</p>
    </div>
</body>
</html>
